version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: best-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: best
    ports:
      - '5432:5432'
    volumes:
      - best_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d best']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  best_postgres_data:
    name: best_postgres_data

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        def offlineMavenRepo = file('../../../vendor/maven')
        if (offlineMavenRepo.exists()) {
            maven { url offlineMavenRepo.toURI() }
        }
        maven { url 'https://maven.aliyun.com/repository/google' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        def offlineMavenRepo = rootProject.file('../../../vendor/maven')
        if (offlineMavenRepo.exists()) {
            maven { url offlineMavenRepo.toURI() }
        }
        maven { url 'https://maven.aliyun.com/repository/google' }
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android.buildToolsVersion rootProject.ext.buildToolsVersion
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

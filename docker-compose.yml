services:
  postgres:
    image: postgres:16-alpine
    container_name: best-postgres
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: best
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - '5432:5432'
    volumes:
      - type: volume
        source: best_postgres_data
        target: /var/lib/postgresql/data
        volume:
          nocopy: true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d best']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: best-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Tehran
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/best?schema=public
      AUTH_JWT_SECRET: change-this-super-secret-value
      AUTH_JWT_ISSUER: best-api
      AUTH_JWT_AUDIENCE: best-dashboard
      AUTH_JWT_ACCESS_TTL: 15m
      AUTH_JWT_REFRESH_TTL: 30d
      BACKUP_DIRECTORY: /app/backups
      BACKUP_INTERVAL_MINUTES: 1440
      BACKUP_CRON: 0 0 * * *
      BACKUP_TIMEZONE: Asia/Tehran
      SEED_SUPER_ADMIN_USERNAME: superadmin
      SEED_SUPER_ADMIN_PASSWORD: Best@123456
      SEED_SUPER_ADMIN_FIRSTNAME: مدیر
      SEED_SUPER_ADMIN_LASTNAME: اصلی
    expose:
      - '3000'
    volumes:
      - type: volume
        source: best_api_backups
        target: /app/backups
        volume:
          nocopy: true

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: best-dashboard
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - '80'

  nginx:
    image: nginx:1.27-alpine
    container_name: best-nginx
    restart: unless-stopped
    depends_on:
      - api
      - dashboard
    ports:
      - '80:80'
    volumes:
      - ./apps/nginx/general.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/nginx/backend.conf:/etc/nginx/snippets/backend.conf:ro
      - ./apps/nginx/panel.conf:/etc/nginx/snippets/panel.conf:ro

volumes:
  best_postgres_data:
    name: best_postgres_data
    driver: local
  best_api_backups:
    name: best_api_backups
    driver: local

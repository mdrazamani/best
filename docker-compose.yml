services:
  postgres:
    image: postgres:16-alpine
    container_name: best-postgres
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-BestDbBestDb_2026_Secure}
      POSTGRES_DB: ${POSTGRES_DB:-best}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - '5432:5432'
    volumes:
      - type: volume
        source: best_postgres_data
        target: /var/lib/postgresql/data
        volume:
          nocopy: true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: best-api
    command: node dist/apps/api/main.js
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Tehran
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-best}?schema=public
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-BestJwt_2026_Str0ng_S3cret_For_Production_Change_This_Immediately}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-best-api}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-best-dashboard}
      AUTH_JWT_ACCESS_TTL: ${AUTH_JWT_ACCESS_TTL:-15m}
      AUTH_JWT_REFRESH_TTL: ${AUTH_JWT_REFRESH_TTL:-30d}
      BACKUP_DIRECTORY: /app/backups
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-1440}
      BACKUP_CRON: ${BACKUP_CRON:-0 0 * * *}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Asia/Tehran}
      SEED_SUPER_ADMIN_USERNAME: ${SEED_SUPER_ADMIN_USERNAME:-superadmin}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-Best@123456}
      SEED_SUPER_ADMIN_FIRSTNAME: ${SEED_SUPER_ADMIN_FIRSTNAME:-Manager}
      SEED_SUPER_ADMIN_LASTNAME: ${SEED_SUPER_ADMIN_LASTNAME:-Admin}
    expose:
      - '3000'
    volumes:
      - type: volume
        source: best_api_backups
        target: /app/backups
        volume:
          nocopy: true
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  dashboard:
    build:
      context: .
      dockerfile: ./apps/dashboard/Dockerfile
    container_name: best-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - '80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: best-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    ports:
      - '80:80'
    volumes:
      - ./apps/nginx/general.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/nginx/backend.conf:/etc/nginx/snippets/backend.conf:ro
      - ./apps/nginx/panel.conf:/etc/nginx/snippets/panel.conf:ro

volumes:
  best_postgres_data:
    name: best_postgres_data
    driver: local
  best_api_backups:
    name: best_api_backups
    driver: local
